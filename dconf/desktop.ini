[org/gnome/desktop/background]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file://@HOME@/.local/share/backgrounds/photo_2026-09-13_18-53-09.jpg'
picture-uri-dark='file://@HOME@/.local/share/backgrounds/photo_2026-09-13_18-53-09.jpg'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
cursor-size=24
cursor-theme='Remus-White'
enable-animations=true
enable-hot-corners=false
gtk-enable-primary-paste=false
gtk-key-theme='Default'
gtk-theme='Tahoe-Soft'
icon-theme='Tahoe-BlueGray'
toolkit-accessibility=false

[org/gnome/desktop/screensaver]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file://@HOME@/.local/share/backgrounds/photo_2026-09-13_18-53-09.jpg'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/wm/preferences]
button-layout='close,minimize,maximize:appmenu'
focus-mode='click'
mouse-button-modifier='<Super>'
resize-with-right-button=true
theme='Adwaita'

